# The removed-path table: the one source of truth for the release 0.10.0
# hard cutover (SCION-CENTRALIZED-CAPABILITIES-R046.1). One entry per row of
# the plan's removed-path map in specs/centralized-capabilities/plan.md.
#
# old   the dotted module or function name that is gone.
# new   the dotted replacement that imports.
# kind  module   the old module is absent; the new module imports.
#        function the old name is gone from its former module, which still
#                 ships; the new name imports from the new module.
#        argument like function, plus: the replacement exposes the named
#                 argument (or, for a command module, the subcommand).
#
# The decide row of the plan map names two removed functions; each carries
# its own entry so each old name is proven absent.

